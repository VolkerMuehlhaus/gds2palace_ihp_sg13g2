# Model scripts that the example tests run (tests/test_examples_*.py). Every script in workflow/ must be listed:
# test_every_workflow_script_is_listed fails for one that is missing.
#
#   script    path from the repository root
#   tiers     "reader": GDS reader output against the layout (seconds)
#             "geometry": gmsh geometry against layout and stackup (no meshing)
#             "model": meshed model files (marker "examples")
#   note      why a tier is left out

[[example]]
script = "workflow/palace_line_viaport.py"
tiers = ["reader", "geometry", "model"]

[[example]]
script = "workflow/palace_line_portwall.py"
tiers = ["reader", "geometry", "model"]

[[example]]
script = "workflow/palace_line_noGDS.py"
tiers = ["model"]
note = "no GDSII file: the geometry is built in the script, so there is no layout to compare with"

[[example]]
script = "workflow/palace_L2n0.py"
tiers = ["reader", "geometry", "model"]

[[example]]
